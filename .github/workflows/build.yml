name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        juce: [7.0.12]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DLOOPCAPTURE_JUCE_TAG=${{ matrix.juce }} -DLOOPCAPTURE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: JUCE-PLUGGIN-${{ matrix.os }}-JUCE-${{ matrix.juce }}
          path: build/LoopCapture_artefacts/Release/
