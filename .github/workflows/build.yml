name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            juce: "7.0.12"
          - os: macos-15
            juce: "8.0.6"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Select macOS toolchain
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build "-DLOOPCAPTURE_JUCE_TAG=${{ matrix.juce }}" "-DLOOPCAPTURE_BUILD_TESTS=ON" "-DCMAKE_BUILD_TYPE=Release"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: JUCE-PLUGGIN-${{ matrix.os }}-JUCE-${{ matrix.juce }}
          path: build/LoopCapture_artefacts/Release/
          if-no-files-found: error
